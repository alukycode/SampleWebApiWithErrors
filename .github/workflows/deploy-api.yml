name: Deploy API

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  API_PUBLISH_DIR: publish-api

jobs:
  build_and_deploy_api:
    environment: production
    name: Build and Deploy API to Azure App Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify deploy secrets present
        env:
          DEPLOY_USER: ${{ secrets.AZURE_API_DEPLOY_USER }}
          DEPLOY_PASS: ${{ secrets.AZURE_API_DEPLOY_PASS }}
        run: |
          test -n "$DEPLOY_USER" || (echo "Missing AZURE_API_DEPLOY_USER" && exit 1)
          test -n "$DEPLOY_PASS" || (echo "Missing AZURE_API_DEPLOY_PASS" && exit 1)

      - name: Publish
        run: dotnet publish ./LogsTriageSampleWebApi -c Release -o ${{ env.API_PUBLISH_DIR }}

      - name: Zip artifact
        run: |
          cd ${{ env.API_PUBLISH_DIR }}
          zip -r ../api.zip .

      - name: Deploy via Kudu zipdeploy
        env:
          DEPLOY_USER: ${{ secrets.AZURE_API_DEPLOY_USER }}
          DEPLOY_PASS: ${{ secrets.AZURE_API_DEPLOY_PASS }}
        run: |
          curl -v --fail-with-body -X POST \
            -u "$DEPLOY_USER:$DEPLOY_PASS" \
            --data-binary @api.zip \
            https://logstriagesamplewebapi.scm.azurewebsites.net/api/zipdeploy
